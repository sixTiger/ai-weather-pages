<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="两个由 AI 根据接口文档生成的天气查询页面">
  <title>AI 天气查询页面</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef5fc; color: #17243a; }
    main { width: min(920px, calc(100% - 32px)); padding: 48px 0; }
    h1 { margin: 0 0 12px; font-size: clamp(32px,5vw,54px); }
    p { margin: 0 0 32px; color: #60708a; font-size: 18px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(280px,1fr)); gap: 20px; }
    a { display: block; padding: 28px; border: 1px solid #d7e2ef; border-radius: 22px; background: white; color: inherit; text-decoration: none; box-shadow: 0 14px 35px rgba(31,80,130,.08); transition: .2s ease; }
    a:hover { transform: translateY(-3px); box-shadow: 0 18px 42px rgba(31,80,130,.14); }
    strong { display: block; margin-bottom: 10px; font-size: 24px; color: #2472bd; }
    span { color: #60708a; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <h1>AI 天气查询页面</h1>
    <p>同一份公开天气接口文档，生成的两个独立页面版本。</p>
    <div class="grid">
      <a href="./weather-query.html">
        <strong>天气页面 A</strong>
        <span>输入城市或地区，查看当前天气、空气质量和未来预报。</span>
      </a>
      <a href="./weather.html">
        <strong>天气页面 B</strong>
        <span>另一种页面布局，包含逐小时天气与未来 7 天预报。</span>
      </a>
    </div>
  </main>
</body>
</html>
