<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天气查询</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #1e3c72 0%, #2a5298 60%, #4a7bc4 100%);
    min-height: 100vh; padding: 40px 16px; color: #fff;
  }
  .container { max-width: 860px; margin: 0 auto; }
  h1 { text-align: center; font-size: 26px; margin-bottom: 8px; letter-spacing: 2px; }
  .subtitle { text-align: center; font-size: 13px; opacity: .75; margin-bottom: 28px; }

  /* 搜索区 */
  .search-box { display: flex; gap: 10px; margin-bottom: 12px; }
  .search-box input {
    flex: 1; padding: 13px 18px; font-size: 16px; border: none; border-radius: 10px;
    outline: none; background: rgba(255,255,255,.95); color: #333;
  }
  .search-box button {
    padding: 13px 28px; font-size: 16px; border: none; border-radius: 10px;
    background: #ff9f43; color: #fff; cursor: pointer; font-weight: 600;
    transition: background .2s;
  }
  .search-box button:hover { background: #f38f1f; }
  .search-box button:disabled { background: #b8b8b8; cursor: not-allowed; }

  /* 候选城市列表 */
  .candidates { background: rgba(255,255,255,.12); border-radius: 10px; margin-bottom: 20px; display: none; }
  .candidates.show { display: block; }
  .candidates .tip { font-size: 12px; opacity: .8; padding: 10px 14px 4px; }
  .candidates .list { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 14px 14px; }
  .candidates .city {
    padding: 7px 14px; background: rgba(255,255,255,.2); border-radius: 20px;
    cursor: pointer; font-size: 14px; transition: background .15s;
  }
  .candidates .city:hover { background: rgba(255,255,255,.4); }

  /* 状态提示 */
  .status { text-align: center; padding: 20px; font-size: 14px; opacity: .85; display: none; }
  .error { text-align: center; padding: 16px; background: rgba(200,60,60,.35); border-radius: 10px; margin-bottom: 20px; display: none; font-size: 14px; }

  /* 当前天气卡片 */
  .current-card {
    background: rgba(255,255,255,.14); backdrop-filter: blur(8px);
    border-radius: 16px; padding: 26px; margin-bottom: 20px; display: none;
  }
  .current-top { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; }
  .location { font-size: 22px; font-weight: 600; }
  .location small { display: block; font-size: 13px; font-weight: 400; opacity: .8; margin-top: 4px; }
  .now-temp { font-size: 56px; font-weight: 200; line-height: 1; }
  .now-desc { font-size: 16px; opacity: .9; margin-top: 6px; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-top: 22px; }
  .metric {
    background: rgba(0,0,0,.15); border-radius: 10px; padding: 12px 14px;
  }
  .metric .label { font-size: 12px; opacity: .75; }
  .metric .value { font-size: 18px; font-weight: 600; margin-top: 4px; }

  /* 逐日预报 */
  .section-title { font-size: 15px; font-weight: 600; margin: 24px 0 12px; opacity: .9; }
  .daily { display: grid; grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); gap: 10px; }
  .day-card {
    background: rgba(255,255,255,.12); border-radius: 12px; padding: 14px 10px;
    text-align: center; font-size: 13px;
  }
  .day-card .d-date { font-weight: 600; }
  .day-card .d-icon { font-size: 30px; margin: 8px 0; }
  .day-card .d-desc { font-size: 12px; opacity: .85; margin-bottom: 8px; min-height: 16px; }
  .day-card .d-range { font-size: 14px; }
  .day-card .d-range .hi { font-weight: 600; }
  .day-card .d-range .lo { opacity: .75; }
  .day-card .d-rain { font-size: 11px; opacity: .8; margin-top: 4px; }

  /* 逐时预报（横向滚动） */
  .hourly-wrap { overflow-x: auto; padding-bottom: 8px; }
  .hourly { display: flex; gap: 10px; min-width: max-content; }
  .hour-card {
    background: rgba(255,255,255,.12); border-radius: 12px; padding: 12px 14px;
    text-align: center; font-size: 12px; min-width: 72px;
  }
  .hour-card .h-time { opacity: .85; }
  .hour-card .h-icon { font-size: 24px; margin: 6px 0; }
  .hour-card .h-temp { font-size: 16px; font-weight: 600; }
  .hour-card .h-rain { font-size: 11px; opacity: .8; margin-top: 4px; }

  /* 空气质量 */
  .aqi-bar {
    display: flex; align-items: center; gap: 14px;
    background: rgba(255,255,255,.12); border-radius: 12px; padding: 14px 18px;
    flex-wrap: wrap;
  }
  .aqi-badge {
    padding: 6px 16px; border-radius: 20px; font-weight: 600; font-size: 14px; color: #fff;
  }
  .aqi-items { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; opacity: .92; }

  .footer-note { text-align: center; font-size: 11px; opacity: .55; margin-top: 30px; }
</style>
</head>
<body>
<div class="container">
  <h1>🌤️ 天气查询</h1>
  <div class="subtitle">输入城市或地址名称，查询实时天气与未来 7 天预报</div>

  <div class="search-box">
    <input id="addrInput" type="text" placeholder="例如：北京、上海、杭州西湖…" autocomplete="off">
    <button id="searchBtn" onclick="doSearch()">查询</button>
  </div>

  <div class="candidates" id="candidates">
    <div class="tip">该地址匹配到多个位置，请选择：</div>
    <div class="list" id="candList"></div>
  </div>

  <div class="error" id="errorMsg"></div>
  <div class="status" id="statusMsg">查询中…</div>

  <div class="current-card" id="currentCard">
    <div class="current-top">
      <div>
        <div class="location" id="locName">--<small id="locDetail"></small></div>
      </div>
      <div style="text-align:right">
        <div class="now-temp" id="nowTemp">--</div>
        <div class="now-desc" id="nowDesc">--</div>
      </div>
    </div>
    <div class="metrics" id="metrics"></div>
  </div>

  <div id="resultArea" style="display:none">
    <div class="section-title">📅 未来 7 天预报</div>
    <div class="daily" id="dailyList"></div>

    <div class="section-title">🕐 未来 24 小时</div>
    <div class="hourly-wrap"><div class="hourly" id="hourlyList"></div></div>

    <div class="section-title">🍃 空气质量</div>
    <div class="aqi-bar" id="aqiBar"></div>
  </div>

  <div class="footer-note">数据来源：Open-Meteo（DWD / NOAA / ECMWF / CMA 等国家气象局模型）</div>
</div>

<script>
const GEO_API   = 'https://geocoding-api.open-meteo.com/v1/search';
const FORECAST_API = 'https://api.open-meteo.com/v1/forecast';
const AIR_API   = 'https://air-quality-api.open-meteo.com/v1/air-quality';

// WMO 天气编码 → 中文描述 + emoji（依据接口文档附录 B）
const WMO = {
  0:['晴天','☀️'], 1:['大部晴','🌤️'], 2:['多云','⛅'], 3:['阴天','☁️'],
  45:['雾','🌫️'], 48:['冻雾','🌫️'],
  51:['小毛毛雨','🌦️'], 53:['毛毛雨','🌦️'], 55:['大毛毛雨','🌧️'],
  56:['冻毛毛雨','🌧️'], 57:['大冻毛毛雨','🌧️'],
  61:['小雨','🌦️'], 63:['中雨','🌧️'], 65:['大雨','🌧️'],
  66:['冻雨','🌧️'], 67:['大冻雨','🌧️'],
  71:['小雪','🌨️'], 73:['中雪','❄️'], 75:['大雪','❄️'], 77:['雪粒','🌨️'],
  80:['小阵雨','🌦️'], 81:['阵雨','🌧️'], 82:['大阵雨','⛈️'],
  85:['小阵雪','🌨️'], 86:['大阵雪','❄️'],
  95:['雷暴','⛈️'], 96:['雷暴伴冰雹','⛈️'], 99:['大雷暴伴冰雹','⛈️']
};
const wmoDesc = c => (WMO[c] || ['未知','🌡️'])[0];
const wmoIcon = c => (WMO[c] || ['未知','🌡️'])[1];

// US AQI 等级（依据接口文档附录 C）
function aqiLevel(aqi) {
  if (aqi == null) return { text: '暂无数据', color: '#888' };
  if (aqi <= 50)  return { text: '优', color: '#00b894' };
  if (aqi <= 100) return { text: '良', color: '#fdcb6e' };
  if (aqi <= 150) return { text: '轻度污染', color: '#e17055' };
  if (aqi <= 200) return { text: '中度污染', color: '#d63031' };
  if (aqi <= 300) return { text: '重度污染', color: '#a55eea' };
  return { text: '严重污染', color: '#6d3b3b' };
}

// 风向角度 → 中文方位（依据接口文档附录 F）
function windDir(deg) {
  const dirs = ['北风','北东北风','东北风','东东北风','东风','东东南风','东南风','南东南风',
                '南风','南西南风','西南风','西西南风','西风','西西北风','西北风','北西北风'];
  return dirs[Math.round(deg / 22.5) % 16];
}

const $ = id => document.getElementById(id);

function show(el, on = true) { el.style.display = on ? (el.classList.contains('current-card') ? 'block' : 'block') : 'none'; }
function setStatus(text) { const s = $('statusMsg'); if (text) { s.textContent = text; show(s); } else s.style.display = 'none'; }
function setError(text) { const e = $('errorMsg'); if (text) { e.textContent = text; show(e); } else e.style.display = 'none'; }

// 第一步：地理编码，地址 → 坐标
async function doSearch() {
  const addr = $('addrInput').value.trim();
  if (!addr) { setError('请输入地址名称'); return; }

  setError(''); setStatus('正在定位「' + addr + '」…');
  $('candidates').classList.remove('show');
  $('searchBtn').disabled = true;

  try {
    const res = await fetch(`${GEO_API}?name=${encodeURIComponent(addr)}&count=5&language=zh`);
    if (!res.ok) throw new Error('地理编码服务返回 ' + res.status);
    const data = await res.json();
    const results = data.results || [];

    if (results.length === 0) {
      setStatus(''); setError('未找到「' + addr + '」对应的位置，请换个名称试试（例如：北京、Tokyo）');
      return;
    }
    if (results.length === 1) {
      await loadWeather(results[0]);
    } else {
      setStatus('');
      renderCandidates(results);
    }
  } catch (err) {
    setStatus(''); setError('查询失败：' + err.message);
  } finally {
    $('searchBtn').disabled = false;
  }
}

function renderCandidates(results) {
  const list = $('candList');
  list.innerHTML = '';
  results.forEach(r => {
    const div = document.createElement('div');
    div.className = 'city';
    const region = [r.admin2, r.admin1, r.country].filter(Boolean).join(' · ');
    div.textContent = `${r.name}（${region}）`;
    div.onclick = () => {
      $('candidates').classList.remove('show');
      loadWeather(r);
    };
    list.appendChild(div);
  });
  $('candidates').classList.add('show');
}

// 第二步：并行拉取 天气预报 + 空气质量
async function loadWeather(place) {
  const { latitude: lat, longitude: lon, timezone: tz } = place;
  const params = new URLSearchParams({
    latitude: lat, longitude: lon, timezone: tz || 'auto', forecast_days: '7',
    current: 'temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,precipitation,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,is_day',
    hourly: 'temperature_2m,weather_code,precipitation_probability',
    daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,sunrise,sunset,uv_index_max'
  });
  const airParams = new URLSearchParams({
    latitude: lat, longitude: lon, timezone: tz || 'auto',
    current: 'us_aqi,pm2_5,pm10,ozone,nitrogen_dioxide'
  });

  setStatus('正在获取「' + place.name + '」的天气数据…');
  $('resultArea').style.display = 'none';
  $('currentCard').style.display = 'none';

  try {
    const [wRes, aRes] = await Promise.all([
      fetch(`${FORECAST_API}?${params}`),
      fetch(`${AIR_API}?${airParams}`).catch(() => null)
    ]);
    if (!wRes.ok) throw new Error('天气服务返回 ' + wRes.status);
    const weather = await wRes.json();
    const air = aRes && aRes.ok ? await aRes.json() : null;

    renderWeather(place, weather, air);
  } catch (err) {
    setError('获取天气失败：' + err.message);
  } finally {
    setStatus('');
  }
}

function renderWeather(place, w, air) {
  // —— 当前天气 ——
  const c = w.current || {};
  $('locName').firstChild.textContent = place.name;
  $('locDetail').textContent = [place.admin2, place.admin1, place.country].filter(Boolean).join(' · ')
    + `　(${place.latitude.toFixed(2)}, ${place.longitude.toFixed(2)})`;
  $('nowTemp').textContent = (c.temperature_2m != null ? Math.round(c.temperature_2m) : '--') + '°C';
  $('nowDesc').textContent = `${wmoIcon(c.weather_code)} ${wmoDesc(c.weather_code)}　体感 ${c.apparent_temperature != null ? Math.round(c.apparent_temperature) : '--'}°C`;

  const metrics = [
    ['💧 相对湿度', c.relative_humidity_2m != null ? c.relative_humidity_2m + '%' : '--'],
    ['🌧️ 降水量', c.precipitation != null ? c.precipitation + ' mm' : '--'],
    ['☁️ 云量', c.cloud_cover != null ? c.cloud_cover + '%' : '--'],
    ['🌬️ 风速 / 风向', c.wind_speed_10m != null ? `${c.wind_speed_10m} km/h ${windDir(c.wind_direction_10m || 0)}` : '--'],
    ['🧭 气压', c.pressure_msl != null ? c.pressure_msl + ' hPa' : '--'],
    ['🕐 昼 / 夜', c.is_day === 1 ? '白天 ☀️' : '夜间 🌙'],
  ];
  $('metrics').innerHTML = metrics.map(m =>
    `<div class="metric"><div class="label">${m[0]}</div><div class="value">${m[1]}</div></div>`).join('');
  $('currentCard').style.display = 'block';

  // —— 逐日预报 ——
  const d = w.daily || {};
  const weekNames = ['周日','周一','周二','周三','周四','周五','周六'];
  let dailyHtml = '';
  for (let i = 0; i < (d.time || []).length; i++) {
    const date = new Date(d.time[i] + 'T00:00:00');
    const label = i === 0 ? '今天' : (i === 1 ? '明天' : `${date.getMonth()+1}/${date.getDate()} ${weekNames[date.getDay()]}`);
    dailyHtml += `<div class="day-card">
      <div class="d-date">${label}</div>
      <div class="d-icon">${wmoIcon(d.weather_code[i])}</div>
      <div class="d-desc">${wmoDesc(d.weather_code[i])}</div>
      <div class="d-range"><span class="hi">${Math.round(d.temperature_2m_max[i])}°</span> / <span class="lo">${Math.round(d.temperature_2m_min[i])}°</span></div>
      <div class="d-rain">💧 ${d.precipitation_probability_max[i] ?? 0}% ${d.precipitation_sum[i] > 0 ? d.precipitation_sum[i] + 'mm' : ''}</div>
    </div>`;
  }
  $('dailyList').innerHTML = dailyHtml;

  // —— 未来 24 小时 ——
  const h = w.hourly || {};
  const nowHour = c.time ? c.time.slice(0, 13) : '';
  let startIdx = (h.time || []).findIndex(t => t.slice(0, 13) >= nowHour);
  if (startIdx < 0) startIdx = 0;
  let hourlyHtml = '';
  for (let i = startIdx; i < Math.min(startIdx + 24, (h.time || []).length); i++) {
    hourlyHtml += `<div class="hour-card">
      <div class="h-time">${h.time[i].slice(11, 16)}</div>
      <div class="h-icon">${wmoIcon(h.weather_code[i])}</div>
      <div class="h-temp">${Math.round(h.temperature_2m[i])}°</div>
      <div class="h-rain">💧 ${h.precipitation_probability[i] ?? 0}%</div>
    </div>`;
  }
  $('hourlyList').innerHTML = hourlyHtml;

  // —— 空气质量 ——
  let aqiHtml;
  if (air && air.current && air.current.us_aqi != null) {
    const a = air.current;
    const lv = aqiLevel(a.us_aqi);
    aqiHtml = `<span class="aqi-badge" style="background:${lv.color}">AQI ${a.us_aqi} · ${lv.text}</span>
      <div class="aqi-items">
        <span>PM2.5：${a.pm2_5 ?? '--'} μg/m³</span>
        <span>PM10：${a.pm10 ?? '--'} μg/m³</span>
        <span>臭氧 O₃：${a.ozone ?? '--'} μg/m³</span>
        <span>二氧化氮 NO₂：${a.nitrogen_dioxide ?? '--'} μg/m³</span>
      </div>`;
  } else {
    aqiHtml = '<span style="font-size:13px;opacity:.8">该位置暂无空气质量数据</span>';
  }
  $('aqiBar').innerHTML = aqiHtml;

  $('resultArea').style.display = 'block';
}

// 回车触发查询
document.getElementById('addrInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});
</script>
</body>
</html>
