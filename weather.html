<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天气查询</title>
<style>
  :root {
    --bg: #f0f4f8;
    --card: #ffffff;
    --text: #1a2332;
    --text2: #5a6a7e;
    --line: #e3eaf1;
    --accent: #2b6cb0;
    --accent2: #ebf4ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #dbe9f7 0%, var(--bg) 240px);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 16px 64px;
  }
  .container { max-width: 860px; margin: 0 auto; }

  h1 { font-size: 24px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { color: var(--text2); font-size: 13px; margin-bottom: 24px; }

  /* 搜索区 */
  .search-box {
    position: relative;
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
  }
  .search-box input {
    flex: 1;
    padding: 12px 16px;
    font-size: 15px;
    border: 1px solid var(--line);
    border-radius: 10px;
    outline: none;
    background: var(--card);
    transition: border-color .15s;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box button {
    padding: 12px 28px;
    font-size: 15px;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  .search-box button:hover { background: #245a94; }
  .search-box button:disabled { background: #9bb8d4; cursor: not-allowed; }

  /* 城市候选列表 */
  #candidates {
    position: absolute;
    top: 50px; left: 0; right: 110px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(20,40,70,.12);
    overflow: hidden;
    z-index: 20;
    display: none;
  }
  #candidates .item {
    padding: 10px 16px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #candidates .item:hover { background: var(--accent2); }
  #candidates .item .region { color: var(--text2); font-size: 12px; }

  .hint { font-size: 12px; color: var(--text2); margin-bottom: 24px; }
  .hint .eg { color: var(--accent); cursor: pointer; margin-right: 8px; }

  /* 状态提示 */
  .status {
    text-align: center;
    padding: 48px 0;
    color: var(--text2);
    font-size: 14px;
    display: none;
  }
  .error { color: #c53030; }

  /* 当前天气卡片 */
  .current-card {
    background: linear-gradient(135deg, #3b7cc4 0%, #5a9ae0 100%);
    color: #fff;
    border-radius: 16px;
    padding: 28px 32px;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(43,108,176,.25);
  }
  .current-top { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; }
  .current-city { font-size: 20px; font-weight: 600; }
  .current-region { font-size: 13px; opacity: .85; margin-top: 2px; }
  .current-main { display: flex; align-items: center; gap: 20px; margin-top: 16px; flex-wrap: wrap; }
  .current-icon { font-size: 56px; line-height: 1; }
  .current-temp { font-size: 56px; font-weight: 300; }
  .current-temp small { font-size: 22px; font-weight: 400; }
  .current-desc { font-size: 16px; opacity: .95; }
  .current-meta { display: flex; gap: 24px; margin-top: 18px; flex-wrap: wrap; }
  .current-meta .m { min-width: 90px; }
  .current-meta .label { font-size: 12px; opacity: .75; }
  .current-meta .value { font-size: 15px; margin-top: 2px; }
  .aqi-badge {
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    color: #1a2332;
  }

  /* 分区标题 */
  .section-title {
    font-size: 15px;
    font-weight: 600;
    margin: 28px 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::before {
    content: "";
    width: 4px; height: 16px;
    background: var(--accent);
    border-radius: 2px;
  }

  /* 逐小时条 */
  .hourly-scroll {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 8px;
  }
  .hourly-card {
    min-width: 86px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 10px;
    text-align: center;
    font-size: 13px;
  }
  .hourly-card .h { color: var(--text2); font-size: 12px; }
  .hourly-card .ic { font-size: 22px; margin: 6px 0 4px; }
  .hourly-card .t { font-size: 15px; font-weight: 600; }
  .hourly-card .p { color: var(--accent); font-size: 11px; margin-top: 3px; min-height: 14px; }

  /* 七日预报表 */
  .daily-list { display: flex; flex-direction: column; gap: 8px; }
  .daily-row {
    display: grid;
    grid-template-columns: 90px 40px 1fr 150px 90px;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 18px;
    font-size: 14px;
  }
  .daily-row .d-name { font-weight: 600; }
  .daily-row .d-date { color: var(--text2); font-size: 12px; }
  .daily-row .d-icon { font-size: 22px; text-align: center; }
  .daily-row .d-desc { color: var(--text2); font-size: 13px; }
  .daily-row .d-range { text-align: right; }
  .daily-row .d-range .min { color: var(--text2); }
  .daily-row .d-range .bar {
    height: 4px; border-radius: 2px;
    background: linear-gradient(90deg, #63b3ed, #ed8936);
    margin: 5px 0;
  }
  .daily-row .d-prec { text-align: right; color: var(--accent); font-size: 13px; }

  @media (max-width: 640px) {
    .daily-row { grid-template-columns: 70px 32px 1fr 100px; }
    .daily-row .d-prec { display: none; }
    .current-temp { font-size: 44px; }
  }

  .footer-note {
    margin-top: 40px;
    text-align: center;
    font-size: 12px;
    color: #93a3b5;
  }
</style>
</head>
<body>
<div class="container">
  <h1>天气查询</h1>
  <div class="subtitle">输入城市或地区名称，查询实时天气、空气质量与未来 7 天预报</div>

  <div class="search-box">
    <input id="cityInput" type="text" placeholder="输入地址，如：北京、上海市浦东新区、杭州西湖..." autocomplete="off">
    <div id="candidates"></div>
    <button id="searchBtn" onclick="doSearch()">查 询</button>
  </div>
  <div class="hint">
    试试：
    <span class="eg" onclick="quickSearch('北京')">北京</span>
    <span class="eg" onclick="quickSearch('上海')">上海</span>
    <span class="eg" onclick="quickSearch('广州')">广州</span>
    <span class="eg" onclick="quickSearch('成都')">成都</span>
    <span class="eg" onclick="quickSearch('Tokyo')">Tokyo</span>
  </div>

  <div id="status" class="status"></div>
  <div id="result" style="display:none">
    <div class="current-card" id="currentCard"></div>
    <div class="section-title">未来 24 小时</div>
    <div class="hourly-scroll" id="hourlyList"></div>
    <div class="section-title">未来 7 天预报</div>
    <div class="daily-list" id="dailyList"></div>
  </div>

  <div class="footer-note">数据来源：Open-Meteo（DWD / NOAA / ECMWF / CMA 等国家气象局模型）· 更新间隔约 15 分钟</div>
</div>

<script>
// ---------- WMO 天气编码映射 ----------
const WMO = {
  0:  ["晴", "☀️"], 1:  ["大部晴", "🌤️"], 2:  ["多云", "⛅"], 3:  ["阴", "☁️"],
  45: ["雾", "🌫️"], 48: ["冻雾", "🌫️"],
  51: ["小毛毛雨", "🌦️"], 53: ["毛毛雨", "🌦️"], 55: ["大毛毛雨", "🌧️"],
  56: ["冻毛毛雨", "🌧️"], 57: ["大冻毛毛雨", "🌧️"],
  61: ["小雨", "🌦️"], 63: ["中雨", "🌧️"], 65: ["大雨", "🌧️"],
  66: ["冻雨", "🌧️"], 67: ["大冻雨", "🌧️"],
  71: ["小雪", "🌨️"], 73: ["中雪", "❄️"], 75: ["大雪", "❄️"], 77: ["雪粒", "🌨️"],
  80: ["小阵雨", "🌦️"], 81: ["阵雨", "🌧️"], 82: ["强阵雨", "⛈️"],
  85: ["小阵雪", "🌨️"], 86: ["大阵雪", "❄️"],
  95: ["雷暴", "⛈️"], 96: ["雷暴伴冰雹", "⛈️"], 99: ["强雷暴伴冰雹", "⛈️"]
};
const wmoText = c => (WMO[c] || ["未知", "🌡️"])[0];
const wmoIcon = c => (WMO[c] || ["未知", "🌡️"])[1];

// ---------- 风向角度转中文 ----------
function windDir(deg) {
  if (deg == null) return "-";
  const dirs = ["北","北东北","东北","东东北","东","东东南","东南","南东南",
                "南","南西南","西南","西西南","西","西西北","西北","北西北"];
  return dirs[Math.round(deg / 22.5) % 16] + "风";
}

// ---------- US AQI 等级 ----------
function aqiLevel(aqi) {
  if (aqi == null) return null;
  if (aqi <= 50)  return { name: "优", color: "#48bb78" };
  if (aqi <= 100) return { name: "良", color: "#ecc94b" };
  if (aqi <= 150) return { name: "轻度污染", color: "#ed8936" };
  if (aqi <= 200) return { name: "中度污染", color: "#fc8181" };
  if (aqi <= 300) return { name: "重度污染", color: "#b794f4" };
  return { name: "严重污染", color: "#feb2b2" };
}

const $ = id => document.getElementById(id);
const input = $("cityInput");
let hideTimer = null;

// ---------- 输入联想（地理编码搜索） ----------
let debounceTimer = null;
input.addEventListener("input", () => {
  clearTimeout(debounceTimer);
  const q = input.value.trim();
  if (!q) { $("candidates").style.display = "none"; return; }
  debounceTimer = setTimeout(() => geocode(q, true), 350);
});
input.addEventListener("keydown", e => {
  if (e.key === "Enter") doSearch();
});

async function geocode(name, asSuggest) {
  try {
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=6&language=zh`;
    const res = await fetch(url);
    const data = await res.json();
    const results = data.results || [];
    if (asSuggest) {
      if (!results.length) { $("candidates").style.display = "none"; return null; }
      showCandidates(results);
      return null;
    }
    return results.length ? results[0] : null;
  } catch (e) {
    if (!asSuggest) throw new Error("地理编码服务请求失败，请稍后重试");
    return null;
  }
}

function showCandidates(results) {
  const box = $("candidates");
  box.innerHTML = results.map(r => {
    const region = [r.admin2, r.admin1, r.country].filter(Boolean).join(" · ");
    return `<div class="item" onclick="pickCandidate(${JSON.stringify(r).replace(/"/g, '&quot;')})">
      <span>${r.name}</span><span class="region">${region}</span></div>`;
  }).join("");
  box.style.display = "block";
}
function pickCandidate(r) {
  $("candidates").style.display = "none";
  input.value = r.name;
  loadWeather(r);
}
document.addEventListener("click", e => {
  if (!e.target.closest(".search-box")) $("candidates").style.display = "none";
});

function quickSearch(name) { input.value = name; doSearch(); }

// ---------- 主流程 ----------
async function doSearch() {
  const q = input.value.trim();
  if (!q) { showError("请输入要查询的地址"); return; }
  $("candidates").style.display = "none";
  showLoading("正在查询 " + q + " ...");
  try {
    const place = await geocode(q, false);
    if (!place) { showError("未找到该地点，请换个名称试试（如：北京、上海浦东）"); return; }
    await loadWeather(place);
  } catch (e) {
    showError(e.message || "查询失败，请稍后重试");
  }
}

function showLoading(msg) {
  $("result").style.display = "none";
  const s = $("status");
  s.className = "status";
  s.textContent = msg;
  s.style.display = "block";
}
function showError(msg) {
  $("result").style.display = "none";
  const s = $("status");
  s.className = "status error";
  s.textContent = "❌ " + msg;
  s.style.display = "block";
}

async function loadWeather(place) {
  showLoading("正在获取 " + place.name + " 的天气数据...");
  const { latitude: lat, longitude: lon } = place;

  const forecastUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
    `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,precipitation,pressure_msl,is_day` +
    `&hourly=temperature_2m,weather_code,precipitation_probability` +
    `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,sunrise,sunset,uv_index_max` +
    `&timezone=auto&forecast_days=7`;
  const airUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}` +
    `&current=us_aqi,pm2_5,pm10&timezone=auto`;

  const [fRes, aRes] = await Promise.all([
    fetch(forecastUrl).then(r => { if (!r.ok) throw new Error("天气服务返回异常"); return r.json(); }),
    fetch(airUrl).then(r => r.ok ? r.json() : null).catch(() => null)
  ]);

  render(place, fRes, aRes);
}

// ---------- 渲染 ----------
function render(place, f, air) {
  const cur = f.current;
  const region = [place.admin2, place.admin1, place.country].filter(Boolean).join(" · ");
  const aqi = air && air.current ? air.current.us_aqi : null;
  const aq = aqiLevel(aqi);

  let metaHtml = `
    <div class="m"><div class="label">体感温度</div><div class="value">${cur.apparent_temperature}°C</div></div>
    <div class="m"><div class="label">相对湿度</div><div class="value">${cur.relative_humidity_2m}%</div></div>
    <div class="m"><div class="label">风向风速</div><div class="value">${windDir(cur.wind_direction_10m)} ${cur.wind_speed_10m} km/h</div></div>
    <div class="m"><div class="label">阵风</div><div class="value">${cur.wind_gusts_10m} km/h</div></div>
    <div class="m"><div class="label">气压</div><div class="value">${cur.pressure_msl} hPa</div></div>
    <div class="m"><div class="label">降水量</div><div class="value">${cur.precipitation} mm</div></div>`;
  if (aq != null && air.current) {
    metaHtml += `
    <div class="m"><div class="label">空气质量 (US AQI)</div>
      <div class="value"><span class="aqi-badge" style="background:${aq.color}">${aqi} · ${aq.name}</span></div>
      <div class="label" style="margin-top:3px">PM2.5 ${air.current.pm2_5} · PM10 ${air.current.pm10} μg/m³</div></div>`;
  }

  $("currentCard").innerHTML = `
    <div class="current-top">
      <div>
        <div class="current-city">${place.name}</div>
        <div class="current-region">${region} · ${f.timezone.replace("_", " ")}</div>
      </div>
      <div class="current-region">更新时间：${cur.time.replace("T", " ")}</div>
    </div>
    <div class="current-main">
      <div class="current-icon">${wmoIcon(cur.weather_code)}</div>
      <div>
        <div class="current-temp">${cur.temperature_2m}<small>°C</small></div>
        <div class="current-desc">${wmoText(cur.weather_code)}${cur.is_day ? "" : " · 夜间"}</div>
      </div>
    </div>
    <div class="current-meta">${metaHtml}</div>`;

  // 未来 24 小时：从当前整点开始取 24 个
  const nowIdx = Math.max(0, f.hourly.time.findIndex(t => t >= cur.time.slice(0, 13)));
  let hourlyHtml = "";
  for (let i = nowIdx; i < Math.min(nowIdx + 24, f.hourly.time.length); i++) {
    const t = f.hourly.time[i];
    const prob = f.hourly.precipitation_probability[i];
    hourlyHtml += `
      <div class="hourly-card">
        <div class="h">${t.slice(11, 16)}</div>
        <div class="ic">${wmoIcon(f.hourly.weather_code[i])}</div>
        <div class="t">${f.hourly.temperature_2m[i]}°</div>
        <div class="p">${prob > 0 ? "💧" + prob + "%" : ""}</div>
      </div>`;
  }
  $("hourlyList").innerHTML = hourlyHtml;

  // 未来 7 天
  const weekNames = ["周日","周一","周二","周三","周四","周五","周六"];
  const allMax = Math.max(...f.daily.temperature_2m_max);
  const allMin = Math.min(...f.daily.temperature_2m_min);
  const span = allMax - allMin || 1;
  let dailyHtml = "";
  for (let i = 0; i < f.daily.time.length; i++) {
    const d = new Date(f.daily.time[i] + "T00:00:00");
    const dayName = i === 0 ? "今天" : (i === 1 ? "明天" : weekNames[d.getDay()]);
    const left = ((f.daily.temperature_2m_min[i] - allMin) / span) * 100;
    const width = ((f.daily.temperature_2m_max[i] - f.daily.temperature_2m_min[i]) / span) * 100;
    const prob = f.daily.precipitation_probability_max[i];
    const uv = f.daily.uv_index_max[i];
    dailyHtml += `
      <div class="daily-row">
        <div><div class="d-name">${dayName}</div><div class="d-date">${f.daily.time[i].slice(5).replace("-", "/")}</div></div>
        <div class="d-icon">${wmoIcon(f.daily.weather_code[i])}</div>
        <div class="d-desc">${wmoText(f.daily.weather_code[i])} · 日出 ${f.daily.sunrise[i].slice(11, 16)} / 日落 ${f.daily.sunset[i].slice(11, 16)}${uv != null ? " · UV " + uv : ""}</div>
        <div class="d-range">
          <span class="min">${f.daily.temperature_2m_min[i]}°</span> ~ ${f.daily.temperature_2m_max[i]}°C
          <div class="bar" style="margin-left:${left}%;width:${Math.max(width, 8)}%"></div>
        </div>
        <div class="d-prec">${prob > 0 ? "💧" + prob + "%" : (f.daily.precipitation_sum[i] > 0 ? f.daily.precipitation_sum[i] + "mm" : "—")}</div>
      </div>`;
  }
  $("dailyList").innerHTML = dailyHtml;

  $("status").style.display = "none";
  $("result").style.display = "block";
}
</script>
</body>
</html>
